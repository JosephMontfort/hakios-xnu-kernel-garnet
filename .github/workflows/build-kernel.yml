name: Build HakiOS Kernel & Loader (Garnet)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Garnet XNU Kernel & Loader
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Architecture & Configuration Integrity
        run: |
          echo "=== 1. Checking driver declarations and subsystems ==="
          python3 tools/drivers-check.py

          echo "=== 2. Checking boot arguments and documentation sync ==="
          python3 tools/boot-args.py --check

          echo "=== 3. Syncing Garnet device repository ==="
          python3 tools/hakios-device.py sync garnet

          echo "=== 4. Checking Garnet device repository integrity ==="
          python3 tools/hakios-device.py check garnet

          echo "=== 5. Applying Garnet defconfig ==="
          python3 tools/hakios-config.py defconfig garnet

          echo "=== 6. Validating .config symbols against drivers ==="
          python3 tools/hakios-config.py check

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            clang \
            lld \
            llvm \
            python3-pip \
            python3-venv \
            meson \
            ninja-build \
            perl \
            xz-utils \
            flex \
            bison \
            m4 \
            autoconf \
            automake \
            libtool \
            liblz4-dev \
            libssl-dev \
            uuid-dev \
            libtinfo6 \
            zip
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: Install Theos Toolchain & iOS SDK
        run: |
          mkdir -p "$HOME/theos/toolchain"
          echo "Fetching iOS LLVM cross toolchain..."
          curl -sL --retry 5 --retry-connrefused --retry-delay 5 https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C "$HOME/theos/toolchain"
          echo "Fetching Theos iOS SDKs..."
          for attempt in 1 2 3; do
            if git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"; then
              break
            fi
            echo "Retrying git clone in 5 seconds..."
            sleep 5
          done
          test -x "$HOME/theos/toolchain/linux/iphone/bin/ld"
          test -d "$HOME/theos/sdks/iPhoneOS16.5.sdk/usr/include"

      - name: Compile Freestanding UEFI Loader
        run: |
          cd xnuloader
          bash build.sh
          cd ..
          test -f xnuloader/loader.efi
          ls -lh xnuloader/loader.efi

      - name: Prepare XNU Source & Cross-Compilation Dependencies
        run: |
          bash xnu/apply.sh
          bash xnu-deps/setup.sh

      - name: Compile XNU Kernel (DEVELOPMENT_ARM64_BCM2837)
        run: |
          mkdir -p out
          touch out/.kernel-start
          ./xnu-build.sh -j$(nproc) -k > out/kernel-build.log 2>&1 || true
          K="xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837"
          if [ -f "$K" ] && [ "$K" -nt out/.kernel-start ]; then
            echo "Kernel compilation succeeded!"
            ls -lh "$K"
          else
            echo "::error::Kernel binary was not created!"
            grep -C 5 -E "error:|fatal error:" out/kernel-build.log || true
            tail -n 100 out/kernel-build.log
            exit 1
          fi

      - name: Compile Userland Dynamic Libraries & Drivers
        run: |
          source xnu-env.sh
          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          FRAMEWORKS="-F $SDK/System/Library/Frameworks"

          cd userland
          mkdir -p obj

          # 1. HakiosMetal bundle
          xnu-clang -arch arm64 -isysroot "$SDK" $FRAMEWORKS -O1 \
            -bundle -framework Foundation -framework Metal -lobjc \
            -Isrc -o obj/HakiosMetal src/HakiosMetal.m src/hakios_metallib.c || true
          if [ -f obj/HakiosMetal ]; then
            mkdir -p obj/HakiosMetal.bundle
            cp obj/HakiosMetal obj/HakiosMetal.bundle/
            cp src/HakiosMetal.plist obj/HakiosMetal.bundle/Info.plist
          fi

          # 2. Injected daemons (backboardd & SpringBoard)
          xnu-clang -arch arm64 -isysroot "$SDK" $FRAMEWORKS -O2 \
            -dynamiclib -install_name /redwood/lib/libredwood.dylib \
            -framework CoreFoundation -framework IOKit -framework IOSurface -lobjc \
            -o obj/libredwood.dylib src/inject.c

          xnu-clang -arch arm64 -isysroot "$SDK" $FRAMEWORKS -O2 \
            -dynamiclib -install_name /redwood/lib/libredwood-sb.dylib \
            -framework CoreFoundation -framework IOKit -framework CoreGraphics -framework IOSurface -lobjc \
            -o obj/libredwood-sb.dylib src/inject_sb.c

          # 3. Sleep daemon stub
          xnu-clang -arch arm64 -isysroot "$SDK" $FRAMEWORKS -O2 \
            -o obj/sleepd_stub src/sleepd_stub.c
          cd ..

      - name: Package Distributable Garnet Release
        run: |
          mkdir -p dist/payload/userland dist/payload/prebuilt
          K="xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837"

          # 1. Base prebuilts from device tree (firmware, splash, dtb, etc.)
          if [ -d devices/garnet/prebuilt ]; then
            cp -a devices/garnet/prebuilt/. dist/payload/prebuilt/ || true
            rm -f dist/payload/prebuilt/garnet-boot.img dist/payload/prebuilt/root.apfs
            if [ -f devices/garnet/prebuilt/root.apfs ]; then
              cp devices/garnet/prebuilt/root.apfs dist/payload/userland/root.apfs
            fi
          fi
          if [ -f devices/garnet/userland/root.apfs ]; then
            cp devices/garnet/userland/root.apfs dist/payload/userland/root.apfs
          fi

          # 2. Freshly compiled kernel & freestanding loader (guaranteed to overwrite any stale prebuilt)
          cp "$K" dist/mach.development.bcm2837
          cp "$K" dist/payload/prebuilt/mach.development.bcm2837
          ln -sf mach.development.bcm2837 dist/payload/prebuilt/hakios-kernel
          if [ -f "${K}.unstripped" ]; then
            cp "${K}.unstripped" dist/mach.development.bcm2837.unstripped
          fi
          cp xnuloader/loader.efi dist/loader.efi
          cp xnuloader/loader.efi dist/payload/prebuilt/loader.efi

          # 3. Boot scripts & CLI tools
          if [ -f devices/garnet/garnet-boot.sh ]; then
            cp devices/garnet/garnet-boot.sh dist/payload/
            chmod +x dist/payload/garnet-boot.sh
          fi
          if [ -f devices/garnet/garnet-boot.ps1 ]; then
            cp devices/garnet/garnet-boot.ps1 dist/payload/
          fi
          if [ -f devices/garnet/garnet-boot.bat ]; then
            cp devices/garnet/garnet-boot.bat dist/payload/
          fi
          if [ -f xl ]; then
            cp xl dist/payload/
            chmod +x dist/payload/xl
          fi
          if [ -f xl.ps1 ]; then
            cp xl.ps1 dist/payload/
          fi

          # 4. Image packing tools (mkxnuimg.py in root, mkpayload.py in xnuloader)
          cp mkxnuimg.py dist/payload/mkxnuimg.py
          chmod +x dist/payload/mkxnuimg.py

          mkdir -p dist/payload/xnuloader
          cp xnuloader/mkpayload.py dist/payload/xnuloader/mkpayload.py
          chmod +x dist/payload/xnuloader/mkpayload.py

          # 5. Pack garnet-boot.img with the newly built loader.efi into root of payload
          python3 xnuloader/mkpayload.py -o /tmp/usb-payload.bin loader.efi=xnuloader/loader.efi splash=dist/payload/prebuilt/splash --usb --no-version
          python3 mkxnuimg.py -d garnet -p /tmp/usb-payload.bin -o dist/payload/garnet-boot.img

          # 6. Ensure strict file deduplication
          rm -f dist/payload/prebuilt/garnet-boot.img dist/payload/prebuilt/root.apfs
          rm -rf dist/payload/xnu_loader

          # Ramdisk placeholder
          if [ -f "devices/garnet/userland/put system.apfs here.txt" ]; then
            cp "devices/garnet/userland/put system.apfs here.txt" dist/payload/userland/
          else
            echo "Download and put the system.apfs inside this directory." > "dist/payload/userland/put system.apfs here.txt"
          fi

          # Generate clean release README
          python3 -c "
          readme = '''HakiOS for POCO X6 5G (garnet / SM7435-AB)
          ===========================================

          Included in this release package:
          - garnet-boot.img                   : Bootable UEFI + resident loader image
          - garnet-boot.sh                    : Linux and Termux interactive boot manager
          - garnet-boot.bat / .ps1            : Windows boot manager
          - xl / xl.ps1                       : Host fastboot communication CLI
          - prebuilt/mach.development.bcm2837 : XNU Kernel with Garnet drivers
          - prebuilt/loader.efi               : Standalone resident XNU loader
          - prebuilt/device-tree.dtb          : Garnet hardware device tree
          - prebuilt/SILICIUM_UEFI.fd         : Silicium UEFI payload
          - userland/root.apfs                : Root filesystem (drivers & LaunchDaemons)
          - userland/put system.apfs here.txt : Instructions for iOS system ramdisk

          Quick Boot Instructions:
          1. Boot your POCO X6 into fastboot mode (Hold Volume Down + Power).
          2. Boot the loader environment:
               fastboot boot garnet-boot.img
          3. Launch the boot manager:
               - On Linux / Termux: ./garnet-boot.sh
               - On Windows       : double-click garnet-boot.bat (or run .\\\\garnet-boot.ps1)
          '''
          with open('dist/payload/README.txt', 'w') as f:
              f.write(readme.strip() + '\\n')
          "

          # Package zip archive for GitHub Releases
          ARCHIVE_NAME="hakios-garnet-${GITHUB_REF_NAME:-$GITHUB_SHA}.zip"
          ARCHIVE_NAME=$(echo "$ARCHIVE_NAME" | tr '/' '-')
          cd dist/payload
          zip -r -y "../../dist/$ARCHIVE_NAME" *
          cd ../..
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
          ls -la dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hakios-garnet-main
          path: dist/payload/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "HakiOS for POCO X6 5G (garnet)"
          body: "Initial release"
          files: |
            dist/${{ env.ARCHIVE_NAME }}
            dist/mach.development.bcm2837
            dist/loader.efi
          draft: false
          prerelease: false
          generate_release_notes: false
